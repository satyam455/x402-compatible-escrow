[package]
name = "agentpay-verdict"
version = "0.1.0"
edition = "2021"
[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["macros"] }
[dev-dependencies]
rand = "0.8"
